<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 260px; padding: 14px; font-family: system-ui, sans-serif; }
    h3 { margin: 0 0 10px; }
    label { display: flex; align-items: center; gap: 8px; margin: 8px 0; font-size: 14px; }
    input[type="text"] { width: 100%; padding: 6px; box-sizing: border-box; }
    .count { margin-top: 12px; font-size: 13px; color: #666; }
  </style>
</head>
<body>
  <h3>🗳️ Prank Vote</h3>
  <label><input type="checkbox" id="enabled" /> Enabled</label>
  <label><input type="checkbox" id="sound" /> Meme sounds</label>
  <label><input type="checkbox" id="random" /> Random party mode</label>
  <label><input type="checkbox" id="codingOnly" /> Only coding sites</label>
  <input type="text" id="party" placeholder="Party name, e.g. BJP 🪷" />
  <div class="count">Fake votes cast: <b id="count">0</b></div>
  <script src="popup.js"></script>
</body>
</html>
